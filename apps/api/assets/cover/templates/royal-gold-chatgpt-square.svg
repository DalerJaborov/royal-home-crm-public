<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
<!-- «Royal Gold · ChatGPT», квадрат 1080×1080. Исходник: docs/cover-sources-23-09/template/templates/cover-square.svg,
     раскладка перенесена внутрь безопасной зоны (x 120–960, y 215–865), шрифт TT Norms Pro. Правила: data-if — блок
     рисуется, только если поле есть; data-fit — кегль строки уменьшается до этой ширины; data-bg — фон (не текст). -->
<defs>
  <linearGradient id="darkOverlay" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#020805" stop-opacity="0.78"/>
    <stop offset="52%" stop-color="#07130F" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#020805" stop-opacity="0.70"/>
  </linearGradient>
  <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#020805" stop-opacity="0"/>
    <stop offset="1" stop-color="#020805" stop-opacity="0.72"/>
  </linearGradient>
  <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FFD979"/>
    <stop offset="48%" stop-color="#F0B548"/>
    <stop offset="100%" stop-color="#C88A25"/>
  </linearGradient>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
  </filter>
</defs>
<g data-bg="1"><rect x="0" y="0" width="1080" height="1080" fill="url(#darkOverlay)"/><rect x="0" y="560" width="1080" height="520" fill="url(#bottomShade)"/></g>
<g id="logo" data-if="vectorLogo" transform="translate(540,268) scale(0.82)">
  <circle cx="0" cy="0" r="47" fill="none" stroke="#F2B94B" stroke-width="5"/>
  <circle cx="0" cy="0" r="38" fill="none" stroke="#F2B94B" stroke-width="2"/>
  <path d="M-28 27 L-10 8 L2 19 L18 2 L34 27 Z" fill="#F2B94B"/>
  <rect x="-18" y="-24" width="10" height="34" fill="#F2B94B"/>
  <rect x="-5" y="-34" width="9" height="44" fill="#F2B94B"/>
  <rect x="7" y="-17" width="9" height="27" fill="#F2B94B"/>
  <rect x="19" y="-29" width="8" height="39" fill="#F2B94B"/>
  <text x="0" y="66" font-family="TT Norms Pro" font-size="15" font-weight="800" fill="#F2B94B" text-anchor="middle">ROYAL</text>
  <text x="0" y="83" font-family="TT Norms Pro" font-size="15" font-weight="800" fill="#F2B94B" text-anchor="middle">HOME TJ</text>
</g>
<g id="rooms" data-if="rooms">
  <text x="118" y="522" font-family="TT Norms Pro" font-size="150" font-weight="800" fill="url(#goldGradient)" data-fit="400">{{rooms}}</text>
  <text x="122" y="592" font-family="TT Norms Pro" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1" data-fit="600">{{roomsWord|upper}}</text>
</g>
<g id="price">
  <rect x="120" y="612" width="620" height="108" rx="18" fill="url(#goldGradient)" filter="url(#softShadow)"/>
  <text x="146" y="690" font-family="TT Norms Pro" font-weight="800" fill="#07130F" data-fit="568"><tspan font-size="68">{{priceNumber}}</tspan><tspan font-size="32" dx="14">{{currency}}</tspan></text>
</g>
<g id="area">
  <rect x="121" y="738" width="258" height="94" rx="12" fill="#07130F" fill-opacity="0.55" stroke="#F2B94B" stroke-width="2"/>
  <text x="250" y="790" font-family="TT Norms Pro" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle" data-fit="226">{{areaNumber}} м²</text>
  <text x="250" y="818" font-family="TT Norms Pro" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">МАСОҲАТ</text>
</g>
<g id="location">
  <text x="404" y="764" font-family="TT Norms Pro" font-size="20" font-weight="800" fill="#FFFFFF" data-fit="330">{{city|upper}}</text>
  <text x="404" y="790" font-family="TT Norms Pro" font-size="14" font-weight="500" fill="#FFFFFF" letter-spacing="1" data-if="district" data-fit="330">РАЙОН: {{district|upper}}</text>
  <text x="404" y="814" font-family="TT Norms Pro" font-size="14" font-weight="500" fill="#FFFFFF" letter-spacing="1" data-if="landmark" data-fit="330">ОРИЕНТИР: {{landmark|upper}}</text>
</g>
<g id="floor" data-if="floor">
  <line x1="752" y1="748" x2="752" y2="818" stroke="#F2B94B" stroke-width="2"/>
  <text x="772" y="764" font-family="TT Norms Pro" font-size="20" font-weight="800" fill="#FFFFFF" data-fit="186">{{floor|upper}}</text>
  <text x="772" y="790" font-family="TT Norms Pro" font-size="13" font-weight="500" fill="#FFFFFF" letter-spacing="2">ЭТАЖ</text>
</g>
</svg>
