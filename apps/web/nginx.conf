# Формат лога для /api/ отдельно от общего access_log (найдено 17.09.2026, разбор
# «Unexpected end of form» на /properties/:id/photos — на проде Caddy без лимитов,
# tmpfs nginx, а лог nginx за тот вечер не сохранился ВООБЩЕ, поэтому вопрос «сколько
# байт реально дошло и сколько объявлял клиент» остался без ответа).
#
# $request_length — сколько байт заголовков+тела nginx РЕАЛЬНО получил от клиента;
# сравнение с Content-Length из самого запроса показывает, оборвался ли клиент до
# конца или тело дошло целиком, а порвал уже кто-то дальше (upstream/таймаут).
# $request_time — сколько шёл запрос целиком: обрыв за миллисекунды — это разрыв
# соединения, а не таймаут. $upstream_status — ответил ли сам API, или обрыв
# случился до него (тогда поле пустое) — API логирует свою часть отдельно
# (app.ts, обработчик "unexpected end of form"), но не видит того, что nginx.
# Определено ДО include conf.d (эта конфигурация — сам файл, включаемый внутри
# http{} базового образа) — иначе access_log ниже не найдёт формат по имени.
log_format api_upload '$remote_addr - $time_local "$request" $status '
                       'len=$request_length time=$request_time upstream=$upstream_status '
                       '"$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # `.mjs` ОТДАВАЛСЯ КАК application/octet-stream (дизайн-проход 14.09.2026,
    # найдено на живом проде через реальную вкладку владельца).
    #
    # Стандартный `mime.types` из образа `nginx:1.27-alpine` не знает расширения
    # `.mjs` вовсе — только `.js`. Единственные два `.mjs`-файла на проде,
    # `apps/web/public/vendor/maplibre/{maplibre-gl-worker,maplibre-gl-shared}.mjs`
    # (см. `scripts/sync-maplibre-worker.mjs`), падали на `default_type`
    # (`application/octet-stream`). MapLibre создаёт этот воркер строго как
    # `new Worker(url, {type:"module"})` — браузер по спецификации ОТКАЗЫВАЕТСЯ
    # выполнять module-скрипт с не-JS Content-Type, воркер не поднимается ни разу,
    # и вся карта объектов остаётся пустой холстом навсегда: ни маркеров, ни
    # кластеров, ни на каком зуме — то самое, из-за чего владелец не видел ничего
    # на `/properties/map`, при этом обычным `fetch()` тот же файл отдавался
    # 200 OK (curl/fetch MIME не проверяют, поэтому баг не был виден по логам).
    #
    # 14.09.2026, тот же вечер — ПОЛНЫЙ ПРОСТОЙ ПРОДА: `types {}` на уровне
    # server{} не добавляет расширение к унаследованной карте, а ПОЛНОСТЬЮ ЕЁ
    # ЗАМЕНЯЕТ для всего этого контекста (комментарий здесь раньше утверждал
    # обратное — неверно). Карта типов сузилась до одного `.mjs`, и `index.html`,
    # `.js`, `.css`, вообще всё — стало отдаваться как `application/octet-stream`.
    # Вместе с `X-Content-Type-Options: nosniff` (Caddy) браузер не смеет
    # угадывать тип: JS/CSS не выполнялись, а HTML вместо отрисовки скачивался
    # файлом — сайт был недоступен ни в одной вкладке без старого кэша.
    # Правильный scoped-фикс — отдельный `location` только на `.mjs`, не трогая
    # унаследованную карту типов вообще.

    # ЗАГОЛОВКИ БЕЗОПАСНОСТИ ЖИВУТ В CADDY, А НЕ ЗДЕСЬ.
    #
    # /etc/caddy/Caddyfile на VPS, блок `header` у host crm.royalhome.tj, ставит
    # HSTS (с includeSubDomains), X-Content-Type-Options, X-Frame-Options: DENY,
    # Referrer-Policy и Permissions-Policy. Caddy стоит перед этим nginx, и его
    # заголовки доходят до браузера.
    #
    # 13.08.2026 я завёл здесь свой набор, считая, что страница приходит без
    # защиты. Это было неверно: защита была, а вышло дублирование — по два
    # Strict-Transport-Security и Referrer-Policy с РАЗНЫМИ значениями в одном
    # ответе. Браузеру это не вредит, но следующий, кто откроет конфиг, не поймёт,
    # откуда что берётся, — а такие места и превращаются в дыры.
    #
    # Остаётся ровно одно, чего у Caddy нет. Оно не отменяет X-Frame-Options от
    # Caddy, а заменяет его современным стандартом: где браузер понимает
    # frame-ancestors, он смотрит только на него.
    #
    # ГРАБЛЯ NGINX: add_header НЕ наследуется в location, где есть свой add_header.
    # Ниже такие есть (/assets/, /sw.js, /manifest.webmanifest, location /) — в
    # location / строка повторена. Для статики она не нужна: рамкой обманывают
    # документ, а не файл со скриптом.
    #
    # Полного CSP здесь намеренно нет — его нельзя включать вслепую, он ломает
    # страницу молча; это отдельная задача с проверкой каждого экрана.
    #
    # ДОБАВЛЯТЬ ЗАГОЛОВКИ БЕЗОПАСНОСТИ СЮДА НЕ НУЖНО: их место в Caddyfile, где
    # лежат остальные. Иначе снова получится два источника правды.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Прокси API и загруженных фото на бэкенд.
    #
    # РЕЗОЛВЕР ОБЯЗАТЕЛЕН (аудит №4, 27.08): со статичным `proxy_pass http://api:4000`
    # nginx резолвит имя ОДИН раз на старте и держит IP навсегда. Деплой только
    # бэкенда пересоздаёт контейнеры api/worker — IP меняются, а web не
    # пересоздаётся, и вся CRM ловила 502 до ручного `restart web`. Переменная в
    # proxy_pass заставляет nginx перерезолвивать имя через Docker DNS (127.0.0.11)
    # с TTL 10 секунд — деплой api больше не требует трогать web.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:4000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ОКНО ПЕРЕСОЗДАНИЯ API (fix/deploy-no-downtime, 22.09.2026): resolver
        # выше переживает смену IP контейнера, но не переживает секунды, пока
        # новый контейнер ещё не слушает порт вовсе (соединение отказано).
        # Короткий connect-таймаут + повтор на следующую попытку соединения
        # ловит именно этот случай. proxy_next_upstream без флага
        # `non_idempotent` по умолчанию НЕ повторяет тело POST/PUT/PATCH —
        # только безопасные методы (GET/HEAD и т.п.), так что повторной записи
        # не будет. depends_on: service_healthy в docker-compose.prod.yml уже
        # закрывает почти всё окно — это подстраховка на оставшиеся секунды.
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 6s;
        # 15 фото × 10 МБ (лимит multer, apps/api/src/upload.ts) — не должно резать
        # раньше, чем реальный лимит на файл/количество.
        client_max_body_size 150m;
        # Сколько nginx ждёт байты ТЕЛА запроса между двумя последовательными
        # порциями (не общее время запроса — за него отвечают proxy_*_timeout
        # ниже). Раньше не было задано вовсе — действовало умолчание nginx в
        # 60 с, которого достаточно почти всегда, но не документировано и не
        # видно в конфиге как сознательное решение. 300 с — с запасом больше
        # xhr.timeout на клиенте (120 с, uploadQueue.ts): если тело не досылают
        # 5 минут, это не медленный мобильный интернет, а зависшее соединение.
        client_body_timeout 300s;
        # Запись разговора API тянет с офисной АТС через туннель и ждёт её до двух
        # минут (FETCH_TIMEOUT_MS в lib/telephony/callRecordings.ts). При умолчании
        # nginx в 60 секунд прокси обрывал бы соединение раньше, чем API сдастся, —
        # и вместо понятной причины агент получал бы 504 на медленной станции.
        # 130 с, а не ровно 120: у API должен остаться шанс ответить самому.
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        # Аудио отдаётся одним куском в несколько мегабайт: без выключенной
        # буферизации nginx сперва сложит его во временный файл на диске.
        proxy_buffering off;
        # См. log_format api_upload вверху файла — диагностика обрыва тела,
        # которой не хватило на разборе 17.09.2026.
        access_log /dev/stdout api_upload;
    }
    # ЗАГРУЗКА СВОБОДНОГО РОЛИКА (12.10.2026, routes/socialVideos.ts: POST /api/v1/social-videos).
    # Приложение принимает файл до 2 ГБ ОДНИМ запросом, а общий /api/ режет тело на 150 МБ.
    # Главное — proxy_request_buffering off: контейнер web работает только на чтение, временные
    # файлы nginx кладёт в tmpfs в 128 МБ, и любое тело крупнее падало бы 500 ещё до API.
    # Выключенная буферизация гонит тело в API по мере прихода. Точное совпадение пути — остальные
    # маршруты раздела (подпись, обложка, публикация) остаются под общим /api/.
    location = /api/v1/social-videos {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        client_max_body_size 2100m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        # API после загрузки перепаковывает файл (до 5 минут) и только потом отвечает.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        access_log /dev/stdout api_upload;
    }

    location /uploads/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # Service worker и manifest не должны кешироваться — иначе PWA не обновится.
    #
    # ИСТОРИЯ ЗАГОЛОВКА (не удалять — по ней сверяются при следующем разборе).
    # 15.08.2026 Cloudflare подменял его своим «Browser Cache TTL»: снаружи
    # /sw.js приходил с `max-age=14400` (4 часа) вместо нашего `no-cache`, и
    # свежий воркер расходился по браузерам с задержкой до четырёх часов.
    # Лечилось только в панели Cloudflare.
    #
    # ✅ ПРОВЕРЕНО 13.09.2026 — подмены больше нет, панель настроена:
    #   curl -sI https://crm.royalhome.tj/sw.js
    #     Cache-Control: no-cache        cf-cache-status: DYNAMIC
    #   curl -sI https://crm.royalhome.tj/version.json
    #     Cache-Control: no-cache        cf-cache-status: DYNAMIC
    #   curl -sI https://crm.royalhome.tj/
    #     Cache-Control: no-cache        cf-cache-status: DYNAMIC
    # Ни одного `age`, ни одного HIT: Cloudflare эти три пути не кэширует и наши
    # заголовки уважает.
    #
    # `no-store`, а не `no-cache`, у трёх путей механизма обновления. `no-cache`
    # разрешает браузеру ХРАНИТЬ ответ и отдавать его после перепроверки — а
    # перепроверка требует сети, которой у телефона в метро нет, и тогда клиент
    # получает вчерашнюю оболочку со ссылками на удалённые хеш-файлы. `no-store`
    # запрещает хранить вовсе: нет записи — нечего и отдать. Файлы весят
    # десятки байт (version.json) и десятки килобайт (sw.js), разница в трафике
    # неизмерима, а вся сборка всё так же лежит в /assets/ на год.
    location = /sw.js {
        add_header Cache-Control "no-store" always;
    }
    location = /version.json {
        add_header Cache-Control "no-store" always;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
    }

    # Хешированные ассеты Vite — кешировать навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # `.mjs` вне общей карты MIME (см. комментарий вверху файла) — scoped-фикс
    # только для этого расширения, остальные типы не трогает.
    location ~* \.mjs$ {
        default_type application/javascript;
    }

    # Публичный «Отчёт владельцу объекта» (/o/<токен>): страница с секретной ссылкой,
    # которую нельзя индексировать. HTML отдаётся той же оболочкой, что и location / —
    # но с X-Robots-Tag; add_header не наследуется, поэтому остальные строки повторены.
    location ^~ /o/ {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # SPA-роутинг: любой путь отдаёт index.html
    #
    # index.html НЕ КЭШИРОВАТЬ. Заголовка здесь не было вовсе, а «нет заголовка»
    # для браузера не значит «не кэшировать»: без Cache-Control он вправе решать
    # сам (эвристика по Last-Modified) и держать страницу в кэше часами. А в
    # index.html лежат ссылки на хешированные файлы сборки — устаревшая страница
    # тянет за собой всю старую версию приложения, даже когда новая уже на
    # сервере. Это ровно та «грабля кэша PWA», из-за которой владелец не раз
    # видел вчерашний интерфейс на свежем сервере.
    #
    # `always` обязателен: без него add_header не ставится на ответы 304 Not
    # Modified, а именно ими и отвечает nginx на повторный заход.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        # Повтор строки сверху — из-за правила наследования add_header (см. там же).
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # Ответ зависит от того, принимает ли клиент сжатие: без Vary промежуточный
    # кэш (в проде впереди Caddy) может отдать сжатый ответ клиенту, который
    # сжатие не просил, — и тот получит мусор вместо страницы.
    gzip_vary on;
}
