# 08.10.2026: туннель станции — ОСНОВНОЙ путь управления через платный реальный адрес (eth1).
# Повтор раз в 15 секунд: в штатной работе туннель держится, повторы бывают только после обрыва.
# StartLimitInterval=0: systemd никогда не «сдаётся» после серии неудач (ночью 08.10 было
# ~4 200 попыток подряд, пока канал стоял — и это правильно, он должен пробовать до победы).
# After=royalhome-eth1: сначала маршрут и файрвол на eth1, потом туннель.
[Unit]
After=royalhome-eth1.service
Wants=royalhome-eth1.service

[Service]
RestartSec=15
StartLimitInterval=0
