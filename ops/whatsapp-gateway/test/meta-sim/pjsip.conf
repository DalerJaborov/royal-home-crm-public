; Имитация Meta для локальной проверки: звонит шлюзу по TLS (с проверкой
; сертификата и имени), SDES, Opus+PCMA, заголовок X-FB-External-Domain,
; digest-пароль. Не для сервера.
[global]
type = global
user_agent = Facebook SipGateway (test)

[tls-client]
type = transport
protocol = tls
bind = 0.0.0.0:5061
cert_file = /test/certs/meta-client.pem
priv_key_file = /test/certs/meta-client.key
ca_list_file = /test/certs/ca.pem
verify_server = yes
method = sslv23

[gw]
type = endpoint
transport = tls-client
context = meta-in
disallow = all
allow = opus,alaw
media_encryption = sdes
ice_support = no
direct_media = no
rtp_symmetric = yes
timers = no
from_user = +992931234567
from_domain = wa.meta.vc
outbound_auth = gw-auth
aors = gw

[gw]
type = aor
contact = sip:wa-sip.test:5061;transport=tls

[gw-auth]
type = auth
auth_type = userpass
username = 992900000001
password = __META_SIM_PASSWORD__

; Второй номер бизнеса (26.11.2026): тот же шлюз, СВОЙ пароль.
[gw2]
type = endpoint
transport = tls-client
context = meta-in
disallow = all
allow = opus,alaw
media_encryption = sdes
ice_support = no
direct_media = no
rtp_symmetric = yes
timers = no
from_user = +992931234567
from_domain = wa.meta.vc
outbound_auth = gw2-auth
aors = gw

[gw2-auth]
type = auth
auth_type = userpass
username = 992900000002
password = __META_SIM_PASSWORD2__

; Имя второго номера, пароль первого: шлюз обязан отказать.
[gw2-cross]
type = endpoint
transport = tls-client
context = meta-in
disallow = all
allow = opus,alaw
media_encryption = sdes
ice_support = no
direct_media = no
timers = no
from_user = +992931234567
from_domain = wa.meta.vc
outbound_auth = gw2-cross-auth
aors = gw

[gw2-cross-auth]
type = auth
auth_type = userpass
username = 992900000002
password = __META_SIM_PASSWORD__

; Тот же адрес, но без пароля: шлюз обязан отказать.
[gw-noauth]
type = endpoint
transport = tls-client
context = meta-in
disallow = all
allow = opus,alaw
media_encryption = sdes
ice_support = no
direct_media = no
timers = no
from_user = +992931234567
from_domain = wa.meta.vc
aors = gw
