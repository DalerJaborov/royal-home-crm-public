[general]
static = yes
writeprotect = yes

[meta-in]
exten => _.,1,Hangup()

; Сценарии проверки (run-e2e.sh): ok — как настоящий звонок Meta; nohdr — без
; заголовка X-FB-External-Domain; wrongnum — на чужой номер; noauth — без пароля.
[meta-test]
exten => ok,1,Set(__HDR=1)
 same => n,Set(TARGET=+992900000001@gw)
 same => n,Goto(d,1)
exten => nohdr,1,Set(__HDR=0)
 same => n,Set(TARGET=+992900000001@gw)
 same => n,Goto(d,1)
exten => wrongnum,1,Set(__HDR=1)
 same => n,Set(TARGET=+992900000099@gw)
 same => n,Goto(d,1)
exten => noauth,1,Set(__HDR=1)
 same => n,Set(TARGET=+992900000001@gw-noauth)
 same => n,Goto(d,1)
exten => d,1,Set(T0=${EPOCH})
 same => n,Dial(PJSIP/${TARGET},25,gb(meta-hdr^s^1))
 same => n,Verbose(1,META-SIM: сценарий ${CHANNEL(linkedid)} DIALSTATUS=${DIALSTATUS} talk=${ANSWEREDTIME} HDR=${HDR} TARGET=${TARGET})
 same => n,Hangup()

[meta-hdr]
exten => s,1,ExecIf($["${HDR}" = "1"]?Set(PJSIP_HEADER(add,X-FB-External-Domain)=wa.meta.vc))
 same => n,Set(PJSIP_HEADER(add,x-wa-meta-wacid)=wacid.TEST123)
 same => n,Set(PJSIP_HEADER(add,x-wa-meta-user-id)=TJ.TESTBSUID)
 same => n,Return()
