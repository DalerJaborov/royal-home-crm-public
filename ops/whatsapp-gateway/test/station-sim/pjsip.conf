; Имитация станции: тот же UDP-транспорт 5062, что у FreePBX, и РОВНО фрагмент
; из репозитория (ops/asterisk/pjsip.endpoint_custom_post.conf) — подключается ниже.
[global]
type = global
user_agent = FPBX-station-sim (test)

[0.0.0.0-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5062

#include pjsip.endpoint_custom_post.conf
