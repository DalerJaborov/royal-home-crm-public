[general]
static = yes
writeprotect = yes

; Настоящий диалплан станции из репозитория: проверяет, что он разбирается
; Asterisk 22 (на станции — 16) и что вход WhatsApp в нём есть.
#include extensions_custom.conf

; Заглушка маршрута FreePBX: на станции здесь входящий маршрут 6501414.
[ext-did]
exten => 6501414,1,Verbose(1,STATION-SIM: вход num=${CALLERID(num)} name=${CALLERID(name)} src=${RH_SOURCE} wacid=${RH_WA_CALL_ID} ctx_ok=1)
 same => n,Wait(1)
 same => n,Answer()
 same => n,Verbose(1,STATION-SIM: ответ, кодек ${CHANNEL(audionativeformat)})
 same => n,Playtones(425)
 same => n,Wait(4)
 same => n,Hangup()
