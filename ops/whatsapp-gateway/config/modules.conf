; Только нужные модули. autoload=no намеренно: шлюз работает в сети хоста
; (network_mode: host), и любой лишний модуль (IAX 4569, AMI 5038, HTTP/ARI 8088)
; открыл бы порт прямо на сервере CRM. Добавлять модуль — осознанной строкой.
[modules]
autoload=no

; ядро конфигурации и таймер (нужен перекодированию и тонам)
load => res_sorcery_config.so
load => res_sorcery_memory.so
load => res_sorcery_astdb.so
load => res_timing_timerfd.so
load => pbx_config.so

; PJSIP: сигнализация
load => res_pjproject.so
load => res_pjsip.so
load => res_pjsip_session.so
load => res_pjsip_pubsub.so
load => chan_pjsip.so
load => res_pjsip_authenticator_digest.so
load => res_pjsip_outbound_authenticator_digest.so
load => res_pjsip_endpoint_identifier_ip.so
load => res_pjsip_caller_id.so
load => res_pjsip_header_funcs.so
load => res_pjsip_nat.so
load => res_pjsip_rfc3326.so
load => res_pjsip_dlg_options.so
load => res_pjsip_logger.so
load => res_pjsip_history.so
load => func_pjsip_endpoint.so

; медиа: RTP, SRTP (SDES), кодеки G.711 a-law и Opus
load => res_rtp_asterisk.so
load => res_srtp.so
load => res_pjsip_sdp_rtp.so
load => codec_alaw.so
load => codec_ulaw.so
load => codec_a_mu.so
load => codec_resample.so
load => codec_opus_open_source.so
load => res_format_attr_opus.so

; мосты
load => bridge_simple.so
load => bridge_native_rtp.so
load => bridge_holding.so

; диалплан
load => app_dial.so
load => app_stack.so
load => app_exec.so
load => app_playtones.so
load => app_verbose.so
load => func_callerid.so
load => func_strings.so
load => func_logic.so
load => func_devstate.so
load => func_channel.so
load => func_global.so

; только консоль: «channel originate» для самопроверки пути шлюз → станция
; (runbook, операция 8). Портов не открывает.
load => res_clioriginate.so
