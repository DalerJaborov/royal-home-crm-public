; =====================================================================
; Royal Home — вход звонков WhatsApp от шлюза на сервере CRM (17.11.2026).
; Ставится в /etc/asterisk/pjsip.endpoint_custom_post.conf — на станции этот
; файл пустой (0 байт, проверено 17.11.2026) и подключается из pjsip.conf
; напрямую (#include pjsip.endpoint_custom_post.conf), FreePBX его не
; перезаписывает. Секции endpoint/aor/identify лежат в одном файле: PJSIP
; различает их по type=, имя файла роли не играет.
;
; Транспорт — СУЩЕСТВУЮЩИЙ 0.0.0.0-udp (5062). Новый транспорт на Asterisk 16
; потребовал бы перезапуска станции; конечная точка подхватывается
; `module reload res_pjsip.so` без обрыва идущих разговоров.
;
; Пароля нет намеренно: шлюз приходит только из VPN с адреса 10.9.0.1
; (identify по адресу). Остальные проверки (сети Meta, пароль Meta, TLS) —
; на шлюзе. Оговорка: с адреса 10.9.0.1 приходят и другие контейнеры сервера
; (их трафик в VPN маскируется адресом tun0) — худшее, что они могут, это
; «позвонить» на городской номер, как любой абонент снаружи.
;
; Откат: очистить файл (`: > /etc/asterisk/pjsip.endpoint_custom_post.conf`)
; и `asterisk -rx "module reload res_pjsip.so"`.
; =====================================================================
[whatsapp-gw]
type = endpoint
transport = 0.0.0.0-udp
; Имя контекста ОБЯЗАНО начинаться с from-trunk: CRM признаёт канал входящим
; звонком по префиксу контекста (apps/api/src/lib/telephony/incomingCalls.ts,
; DEFAULT_INBOUND_CONTEXT_PREFIXES). Другое имя — и CRM не увидит звонок вовсе:
; ни журнала, ни своего агента, ни карточки (тот же класс, что 11.08.2026).
context = from-trunk-whatsapp
disallow = all
allow = alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = no
ice_support = no
media_encryption = no
timers = no
trust_id_inbound = no
send_pai = no
dtmf_mode = rfc4733
allow_subscribe = no
aors = whatsapp-gw

[whatsapp-gw]
type = aor
contact = sip:10.9.0.1:5070
qualify_frequency = 60

[whatsapp-gw]
type = identify
endpoint = whatsapp-gw
match = 10.9.0.1/32
