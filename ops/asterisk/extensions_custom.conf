; =====================================================================
; Royal Home — входящие звонки: запасной путь очереди, ночной режим,
; автоответчик. Заведено 13.08.2026, расширено 14.08.2026.
;
; ЗАЧЕМ. Очередь 1000 живёт с joinempty=yes и без Fail Over: клиент попадал в
; неё, даже когда все операторы офлайн, и не выходил оттуда никогда — слушал
; музыку, пока не бросит трубку. Потерянный клиент, о котором никто не узнавал.
;
; КАК ЭТО РАБОТАЕТ. Входящий маршрут 6501414 ведёт СЮДА (destination в FreePBX).
; Всё, что FreePBX делает ДО (чёрный список, запись, определитель, CDR), уже
; отработало во входящем маршруте и не теряется.
;
; ЗНАЧЕНИЯ ЧИТАЮТСЯ ИЗ ВНУТРЕННЕЙ БАЗЫ (кладёт CRM, Настройки → Каналы связи):
;
;   ROYALHOME/failover/action      none | forward | voicemail | both — днём
;   ROYALHOME/failover/seconds     сколько ждать оператора (пусто — без предела)
;   ROYALHOME/failover/phone       номер дежурного, местные девять цифр
;   ROYALHOME/failover/nightaction none | forward | voicemail — ночное правило
;   ROYALHOME/failover/nightstart  "HH:MM" начало нерабочего времени
;   ROYALHOME/failover/nightend    "HH:MM" конец нерабочего времени
;   ROYALHOME/failover/aimode      "" | no_answer | always — консультант (ИИ)
;   ROYALHOME/failover/aiseconds   сколько днём звонит оператор до консультанта
;   ROYALHOME/failover/aidaystart  "HH:MM" начало рабочего дня (вне его — сразу ИИ)
;   ROYALHOME/failover/aidayend    "HH:MM" конец рабочего дня
;
; КОНСУЛЬТАНТ ВМЕСТО АВТООТВЕТЧИКА (24.09.2026, Dan: «автоответчика больше не
; будет»). aimode пусто — всё как раньше. no_answer — днём оператор (очередь или
; прямой аппарат) звонит aiseconds секунд, потом трубку берёт консультант; вне
; рабочего дня консультант берёт сразу. always — консультант первым. Ночное
; правило и дежурный мобильный в этом режиме не действуют: их заменяет
; консультант, который сам соединяет с агентом (Настройки → Бот → «Живой голос»).
; Консультант не принял звонок (выключен, занят другим разговором, CRM
; недоступна) — Stasis возвращает управление, и дальше старый автоответчик как
; страховка (RH_AIDONE не даёт позвать консультанта второй раз).
;
; __NODEST ОБЯЗАТЕЛЕН: штатный from-queue вешает трубку первой же проверкой без
; него — 14.08 из-за этого входящие вовсе не доходили до операторов.
;
; АВТООТВЕТЧИК — СВОЙ, ДИАЛПЛАНОМ, а не модулем voicemail: у своего в имени файла
; сразу время и номер звонившего (vm-20260814-013000-930001001.wav), CRM забирает
; каталог по httpd и заводит карточку без разбора чужих форматов. Приветствие —
; /var/lib/asterisk/royalhome/greeting.wav (кладёт cron из CRM); пока его нет,
; играет короткий сигнал.
;
; 03.10.2026 (правки после аудита робозвонка):
;  - блок «офисный аппарат 15 с перед очередью» (astdb ROYALHOME/office_first/ext,
;    временно до 09.10) внесён в репозиторий — на станции он стоял с 02.10 вручную;
;  - прямой аппарат с правилом none звонит без предела (как очередь), а не рвёт
;    звонок через RH_DWAIT; запись не дублируется (метка REC_STATUS) в ветках
;    «прямо на аппарат» и «дежурному»;
;  - запасная очередь агентского пути получила __NODEST (без него from-queue вешал трубку);
;  - имя файла автоответчика: номер только цифрами, пусто — unknown;
;  - вердикт known_client уходит к консультанту с аргументом known («агент сейчас
;    недоступен»), а не missed («агент не ответил»): агента станция не набирала.
;
; 11.10.2026 (владелец): «робот НЕ отвечает клиентам агента — даже если агент не
; отвечает, он сам перезвонит; мы никогда не трогаем клиентов, закреплённых за
; агентом». Отменяет пункт 03.10 выше: known_client и «агент своего клиента не
; взял» (royalhome-agent-route, RH_ROUTE_FALLBACK=voicemail) идут на обычный
; автоответчик (vmreal) при ЛЮБОМ режиме консультанта; аргументов known/missed
; станция больше не шлёт. Консультант — только для незакреплённых: общий путь
; (inbound) и возврат от агента, которому ОН сам перевёл звонок (returned,
; RH_ROUTE_FALLBACK=ai).
; Окна ночи и рабочего дня: «начало = конец» станция читает как сутки целиком, а CRM
; (isWithinDushanbeWindow) — как «никогда», поэтому CRM такую пару не принимает.
;
; ПУСТЫЕ ЗНАЧЕНИЯ = ПРЕЖНЕЕ ПОВЕДЕНИЕ. Откат: удалить блок + dialplan reload.
; =====================================================================
[royalhome-inbound]
exten => s,1,NoOp(Royal Home: входящий, правило из ROYALHOME/failover)
; ГУДКИ ВМЕСТО МГНОВЕННОГО ОТВЕТА (владелец 24.09.2026). До 24.09 первой строкой
; стоял Answer(): звонящий с нулевой секунды слышал музыку, его оператор связи
; начинал тарификацию, а оператор Royal Home ещё только начинал звонить (мобильное
; плечо через транк — 2–5 с на установление). Разбор 24.09 по CEL станции
; (hangupsource = сам транковый канал, dialstatus=CANCEL): каждый третий звонящий
; бросал трубку через 8–19 с музыки и набирал снова — «звонок обрывается и
; приходит второй раз». Теперь канал НЕ отвечается до того, как трубку снял
; человек: Ringing() шлёт 180, звонящий слышит обычные гудки своей сети, минуты
; идут только с ответа. Answer() остаётся лишь перед автоответчиком.
; Следствие: ожидание в очереди ограничено сетью звонящего (~30–60 с до
; «абонент не отвечает»), см. ROYALHOME/failover/seconds.
exten => s,n,Ringing()
; ЖДЁМ ВЕРДИКТ CRM ДО ЛЮБОГО ВЕТВЛЕНИЯ — И ЭТО МЕСТО ВЫБРАНО НЕ СЛУЧАЙНО
; (владелец 21.09.2026: «свои клиенты звонят агентам прямо, чужих обслуживаю я;
; один звонок одному человеку, никакой гонки»).
;
; КАК БЫЛО ДО 21.09. Перед очередью стояла фиксированная пауза
; MusicOnHold(royalhome,6): станция отдавала звонок оператору через шесть
; секунд, а CRM параллельно выясняла, чей это клиент, и уводила его агенту.
; Кто успел — тот и взял. Замер 20.09: на трёх звонках известных клиентов за
; день оператор снял трубку раньше перевода (в журнале CRM already_answered,
; один разговор 80 секунд), а когда сервер был занят сборками CI, CRM не
; укладывалась в шесть секунд вовсе.
;
; ПОЧЕМУ ЗДЕСЬ, А НЕ ПЕРЕД ОЧЕРЕДЬЮ. Сначала пауза стояла в ветке очереди — и
; первый же живой опыт в 02:40 показал, что ночью управление до неё не доходит
; вовсе: ночное правило уводит звонок в автоответчик ещё на приоритете 15, и
; гонка ночью осталась бы ровно такой, какой была. Ветвлений у этого контекста
; три (ночь, прямой аппарат, очередь), и защищать надо не одно из них, а всё,
; что идёт после ответа на звонок. Владелец 16.08.2026 выбрал круглосуточную
; работу: ночной звонок своему агенту тем более уместен, очередь в это время
; пуста.
;
; КАК РАБОТАЕТ. Ждём переменную канала RH_CRM_VERDICT — её ставит CRM действием
; Setvar, когда решила окончательно, что своего агента у звонка нет
; (releaseChannelToOperator в lib/telephony/inboundRouting.ts). Свой клиент не
; попадает ни к оператору, ни в автоответчик: до вердикта станция не ветвится
; вовсе. Чужой проходит дальше БЫСТРЕЕ прежнего — за секунду вместо шести
; (замер перевода на живой станции: 0-2 секунды на двадцати звонках).
;
; ПОТОЛОК ОЖИДАНИЯ ЗДЕСЬ, А НЕ В CRM — И ЭТО СУЩЕСТВЕННО. Не дождавшись
; вердикта за RH_CRMMAX секунд, станция идёт дальше сама. Перезапуск CRM, обрыв
; туннеля, выкат контейнера посреди звонка возвращают прежнее поведение (пауза
; и общее правило), а не тишину в трубке. Двенадцать секунд — вдвое больше
; прежней паузы и в шесть раз больше измеренного времени решения.
;
; Перевод на агента (Redirect в royalhome-agent-route) уводит канал отсюда на
; любой секунде ожидания — переведённый звонок паузу не досиживает.
exten => s,n,Set(RH_CRMMAX=12)
exten => s,n,Set(RH_CRMWAIT=0)
exten => s,n(crmwait),GotoIf($["${RH_CRM_VERDICT}"!=""]?crmfree)
exten => s,n,Wait(1)
exten => s,n,Set(RH_CRMWAIT=$[${RH_CRMWAIT}+1])
exten => s,n,GotoIf($[${RH_CRMWAIT}<${RH_CRMMAX}]?crmwait)
exten => s,n,NoOp(Royal Home: вердикт CRM не пришёл за ${RH_CRMMAX} с — дальше по общему правилу)
exten => s,n(crmfree),NoOp(Royal Home: вердикт CRM «${RH_CRM_VERDICT}» за ${RH_CRMWAIT} с — звонок не наш)
exten => s,n,Set(RH_AI=${DB(ROYALHOME/failover/aimode)})
; 22.09.2026 владелец: клиент с назначенным агентом оператору НИКОГДА. Вердикт
; known_client CRM ставит, когда увести звонок агенту на станции не вышло
; (перевод отклонён, контекста royalhome-agent-route нет) — автоответчик, не очередь.
; 11.10.2026 владелец: и не консультанту — ветка knownclient ведёт прямо на vmreal
; при любом aimode (агент перезвонит сам по задаче из автоответчика).
exten => s,n,GotoIf($["${RH_CRM_VERDICT}"="known_client"]?knownclient)
exten => s,n,Set(RH_ACTION=${DB(ROYALHOME/failover/action)})
exten => s,n,Set(RH_PHONE=${DB(ROYALHOME/failover/phone)})
exten => s,n,Set(RH_WAIT=${DB(ROYALHOME/failover/seconds)})
exten => s,n,ExecIf($["${RH_ACTION}"=""]?Set(RH_ACTION=none))
; --- консультант (24.09.2026): вместо ночного правила и вместо автоответчика ---
exten => s,n,GotoIf($["${RH_AI}"=""]?noai)
exten => s,n,Set(RH_ACTION=ai)
exten => s,n,GotoIf($["${RH_AI}"="always"]?ai)
exten => s,n,Set(RH_AISTART=${DB(ROYALHOME/failover/aidaystart)})
exten => s,n,Set(RH_AIEND=${DB(ROYALHOME/failover/aidayend)})
exten => s,n,Set(RH_NOW=${STRFTIME(${EPOCH},Asia/Dushanbe,%H:%M)})
exten => s,n,GotoIf($["${RH_AISTART}"="" | "${RH_AIEND}"=""]?aiday)
exten => s,n,GotoIf($["${RH_AISTART}" < "${RH_AIEND}"]?aisame:aiover)
exten => s,n(aisame),GotoIf($["${RH_NOW}" >= "${RH_AISTART}" & "${RH_NOW}" < "${RH_AIEND}"]?aiday:ai)
exten => s,n(aiover),GotoIf($["${RH_NOW}" >= "${RH_AISTART}" | "${RH_NOW}" < "${RH_AIEND}"]?aiday:ai)
exten => s,n(aiday),Set(RH_WAIT=${DB(ROYALHOME/failover/aiseconds)})
exten => s,n,ExecIf($["${RH_WAIT}"=""]?Set(RH_WAIT=30))
exten => s,n,Goto(target)
; --- ночной режим: в нерабочее время очередь пропускается ---
exten => s,n(noai),Set(RH_NACT=${DB(ROYALHOME/failover/nightaction)})
exten => s,n,Set(RH_NSTART=${DB(ROYALHOME/failover/nightstart)})
exten => s,n,Set(RH_NEND=${DB(ROYALHOME/failover/nightend)})
exten => s,n,Set(RH_NOW=${STRFTIME(${EPOCH},Asia/Dushanbe,%H:%M)})
exten => s,n,GotoIf($["${RH_NACT}"="" | "${RH_NACT}"="none" | "${RH_NSTART}"="" | "${RH_NEND}"=""]?day)
; Окно через полночь (22:00–08:00) — обычное для «нерабочего времени», поэтому
; сравнение двухветочное: то же правило, что в CRM у часов приёма.
exten => s,n,GotoIf($["${RH_NSTART}" < "${RH_NEND}"]?sameday:overnight)
exten => s,n(sameday),GotoIf($["${RH_NOW}" >= "${RH_NSTART}" & "${RH_NOW}" < "${RH_NEND}"]?night:day)
exten => s,n(overnight),GotoIf($["${RH_NOW}" >= "${RH_NSTART}" | "${RH_NOW}" < "${RH_NEND}"]?night:day)
; Ночью действует ночное правило вместо дневного, и очередь не звонит впустую.
exten => s,n(night),Set(RH_ACTION=${RH_NACT})
exten => s,n,Goto(failover)
; --- день: очередь, как раньше ---
exten => s,n(day),ExecIf($["${RH_ACTION}"="none"]?Set(RH_WAIT=))
exten => s,n,ExecIf($["${RH_WAIT}"=""]?Set(RH_WAIT=))
; --- ПРЯМОЙ АППАРАТ ВМЕСТО ОЧЕРЕДИ (настройка CRM «Куда идёт входящий звонок») ---
; Пусто в ROYALHOME/failover/target = звонит очередь операторов, как было с запуска.
; Режим задаётся самим номером: отдельного выключателя нет намеренно, иначе
; появилось бы состояние «режим включён, номера нет» — то есть звонок в тишину.
exten => s,n(target),Set(RH_TARGET=${DB(ROYALHOME/failover/target)})
exten => s,n,GotoIf($["${RH_TARGET}"=""]?queue)
exten => s,n,Set(RH_DWAIT=${IF($["${DB(ROYALHOME/failover/seconds)}"=""]?25:${DB(ROYALHOME/failover/seconds)})})
exten => s,n,ExecIf($["${RH_ACTION}"="ai"]?Set(RH_DWAIT=${RH_WAIT}))
; none = «ждать без предела» (как в очереди): пустой таймаут Dial — звонит, пока не снимут
; или не положат трубку. Раньше none обрывал звонок через RH_DWAIT (03.10.2026).
exten => s,n,ExecIf($["${RH_ACTION}"="none"]?Set(RH_DWAIT=))
exten => s,n,NoOp(Royal Home: входящий прямо на аппарат ${RH_TARGET}, ${RH_DWAIT} с)
exten => s,n,Set(__NODEST=${RH_TARGET})
; Запись включаем здесь же: набор идёт из своего контекста, а штатные макросы
; FreePBX с их правилами записи в этот путь не заходят.
exten => s,n,ExecIf($["${RH_REC}"=""]?Set(__RH_REC=in-${CALLERID(num)}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}))
exten => s,n,ExecIf($["${REC_STATUS}"!="RECORDING"]?MixMonitor(${STRFTIME(${EPOCH},,%Y/%m/%d)}/${RH_REC}.wav,b))
exten => s,n,Set(CDR(recordingfile)=${RH_REC}.wav)
exten => s,n,Set(__REC_STATUS=RECORDING)
; Строка набора берётся из базы самой станции: SIP это или PJSIP, диалплан не знает.
exten => s,n,Dial(${DB(DEVICE/${RH_TARGET}/dial)},${RH_DWAIT},tTr)
exten => s,n,NoOp(Royal Home: аппарат вернул ${DIALSTATUS})
exten => s,n,GotoIf($["${DIALSTATUS}"="ANSWER"]?hangup)
; Не взял, занят, аппарат офлайн — дальше общее правило «если не ответили».
exten => s,n,Goto(failover)
exten => s,n(queue),NoOp(Royal Home: входящий в очередь операторов)
exten => s,n,Set(__NODEST=1000)
; 02.10.2026 ВРЕМЕННО (до 09.10): офисный аппарат звонит ПЕРЕД очередью операторов, 15 с.
; Включатель в astdb: database put ROYALHOME office_first/ext 2020 ; выключить: database del ROYALHOME office_first/ext
; Запись начинается здесь (как в ветке «прямо на аппарат»), REC_STATUS не даёт очереди писать второй раз.
exten => s,n,Set(RH_OFFICE=${DB(ROYALHOME/office_first/ext)})
exten => s,n,GotoIf($["${RH_OFFICE}"=""]?queuego)
exten => s,n,NoOp(Royal Home: сначала офисный аппарат ${RH_OFFICE}, 15 с)
exten => s,n,Set(RH_T0=${EPOCH})
exten => s,n,ExecIf($["${RH_REC}"=""]?Set(__RH_REC=in-${CALLERID(num)}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}))
exten => s,n,ExecIf($["${REC_STATUS}"!="RECORDING"]?MixMonitor(${STRFTIME(${EPOCH},,%Y/%m/%d)}/${RH_REC}.wav,b))
exten => s,n,Set(CDR(recordingfile)=${RH_REC}.wav)
exten => s,n,Set(__REC_STATUS=RECORDING)
; 09.10.2026 владелец: звонит 2020 20 с, не взяли — сразу консультант, без очереди.
; Секунды — ROYALHOME/office_first/secs (пусто = 20).
exten => s,n,Set(RH_OSEC=${DB(ROYALHOME/office_first/secs)})
exten => s,n,ExecIf($["${RH_OSEC}"=""]?Set(RH_OSEC=20))
exten => s,n,Dial(SIP/${RH_OFFICE},${RH_OSEC},tTr)
exten => s,n,NoOp(Royal Home: офисный аппарат вернул ${DIALSTATUS})
exten => s,n,GotoIf($["${DIALSTATUS}"="ANSWER"]?offdone)
; Режим консультанта и в очереди нет ни одного свободного оператора (все на паузе
; или офлайн) — очередь пропускается: клиент не ждёт музыку впустую.
exten => s,n,GotoIf($["${RH_ACTION}"="ai" & "${QUEUE_MEMBER(1000,ready)}"="0"]?failover)
exten => s,n,ExecIf($["${RH_WAIT}"!=""]?Set(RH_WAIT=$[${RH_WAIT}-(${EPOCH}-${RH_T0})]))
exten => s,n,ExecIf($["${RH_WAIT}"!="" & ${RH_WAIT}<10]?Set(RH_WAIT=10))
exten => s,n,Goto(queuego)
exten => s,n(offdone),Hangup()
exten => s,n(queuego),NoOp(Royal Home: правило ${RH_ACTION}, ожидание ${RH_WAIT} с, дежурный ${RH_PHONE})
exten => s,n,Queue(1000,tr,,,${RH_WAIT})
exten => s,n,NoOp(Royal Home: очередь вернула ${QUEUESTATUS})
exten => s,n,GotoIf($["${QUEUESTATUS}"="TIMEOUT"|"${QUEUESTATUS}"="JOINEMPTY"|"${QUEUESTATUS}"="LEAVEEMPTY"|"${QUEUESTATUS}"="JOINUNAVAIL"|"${QUEUESTATUS}"="LEAVEUNAVAIL"|"${QUEUESTATUS}"="FULL"]?failover)
exten => s,n,Hangup()
exten => s,n(failover),GotoIf($["${RH_ACTION}"="ai"]?ai)
exten => s,n,GotoIf($["${RH_ACTION}"="forward"|"${RH_ACTION}"="both"]?forward)
exten => s,n,GotoIf($["${RH_ACTION}"="voicemail"]?voicemail)
; 09.10.2026 (аудит): ни одно правило «если не ответили» не сработало — не обрываем звонок, а оставляем клиенту автоответчик.
exten => s,n,Goto(vmreal)
; Дежурному звоним тем же путём, что CRM звонит сотрудникам: Local в штатный
; контекст, маршрут и определитель выбирает сама FreePBX.
exten => s,n(forward),GotoIf($["${RH_PHONE}"=""]?after)
exten => s,n,ExecIf($["${RH_REC}"=""]?Set(__RH_REC=in-${CALLERID(num)}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}))
exten => s,n,ExecIf($["${REC_STATUS}"!="RECORDING"]?MixMonitor(${STRFTIME(${EPOCH},,%Y/%m/%d)}/${RH_REC}.wav,b))
exten => s,n,Set(CDR(recordingfile)=${RH_REC}.wav)
exten => s,n,Set(__REC_STATUS=RECORDING)
exten => s,n,Dial(Local/${RH_PHONE}@from-internal/n,25,r)
exten => s,n,GotoIf($["${DIALSTATUS}"="ANSWER"]?hangup)
exten => s,n(after),GotoIf($["${RH_ACTION}"="both"|"${RH_ACTION}"="voicemail"]?voicemail)
exten => s,n,Hangup()
; --- автоответчик: приветствие → сигнал → запись до 2 минут (3 с тишины = конец).
; Файл сразу с временем и номером звонившего — CRM забирает каталог по httpd
; (порт 8090) и заводит карточку с задачей перезвонить.
; В режиме консультанта сюда консультант не подключается (11.10.2026): правила
; voicemail/both в этом режиме не действуют (RH_ACTION=ai), а свой клиент агента
; приходит веткой knownclient прямо на vmreal.
exten => s,n(voicemail),NoOp(Royal Home: автоответчик)
; Номер звонившего в имени файла — только цифры, пусто = unknown: имя всегда разбирается.
exten => s,n(vmreal),Set(RH_VMNUM=${FILTER(0123456789,${CALLERID(num)})})
exten => s,n,ExecIf($["${RH_VMNUM}"=""]?Set(RH_VMNUM=unknown))
exten => s,n,Set(RH_VMFILE=/var/spool/asterisk/royalhome-voicemail/vm-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${RH_VMNUM})
exten => s,n,Answer()
exten => s,n,ExecIf($[${STAT(e,/var/lib/asterisk/royalhome/greeting.wav)}]?Playback(/var/lib/asterisk/royalhome/greeting):Playback(beep))
exten => s,n,ExecIf($[${STAT(e,/var/lib/asterisk/royalhome/greeting.wav)}]?Playback(beep))
exten => s,n,Record(${RH_VMFILE}.wav,3,120,k)
exten => s,n(hangup),Hangup()
; --- консультант (24.09.2026). Канал уходит в Stasis-приложение живого голоса:
; CRM отвечает на звонок, говорит, при нужде переводит агенту (канал уходит в
; royalhome-agent-route). Не принял — Stasis возвращает управление сюда же, и
; человек попадает на старый автоответчик.
; Только незакреплённые звонящие (11.10.2026): аргумент всегда inbound.
exten => s,n(ai),Set(RH_AIARG=inbound)
exten => s,n,Set(RH_AIDONE=1)
exten => s,n,NoOp(Royal Home: трубку берёт консультант (${RH_AIARG}))
exten => s,n,Stasis(royalhome-live-voice,${RH_AIARG})
exten => s,n,Log(WARNING,Royal Home: Stasis вернул управление, STASISSTATUS=${STASISSTATUS}, звонок ${CALLERID(num)} уходит на автоответчик)
exten => s,n,Goto(vmreal)
; Свой клиент агента, станция агента не достала (вердикт known_client): робот не
; подключается при любом режиме консультанта (владелец 11.10.2026) — обычный
; автоответчик; CRM забирает запись (voicemailIngest.ts) и ставит ЭТОМУ агенту
; задачу перезвонить.
exten => s,n(knownclient),NoOp(Royal Home: свой клиент агента — автоответчик, консультант не подключается)
exten => s,n,Goto(vmreal)

; === Royal Home CRM: входящий переведён на агента (свой клиент — либо ===
; === незнакомый по KPI-очереди/дежурному) ============================
; Добавлено 16.08.2026, переписано 29.08.2026 (решение владельца): звонок
; ИЗВЕСТНОГО клиента его СВОЕМУ агенту больше НЕ уходит в очередь операторов
; ни при каком исходе — очередь остаётся только для незнакомых и новых
; обращений. Незнакомый звонок по KPI-очереди/дежурному (когда владелец
; включит один из этих режимов) при неудаче по-прежнему возвращается в
; очередь операторов — им туда и место. Какой путь запасной, решает CRM
; переменной RH_ROUTE_FALLBACK, а не сам диалплан: два вызывающих модуля
; (inboundRouting.ts — voicemail, kpiQueueRouting.ts/dutyRosterRouting.ts —
; queue) не должны молча разъехаться с тем, что здесь написано руками.
;
; Агенту звоним долго (по умолчанию 150 с = 2.5 минуты, настраивается CRM);
; голосовая почта — ТА ЖЕ, что у общего приёма (royalhome-inbound, метка
; voicemail выше): тот же каталог, тот же формат имени файла. Её уже забирает
; voicemailIngest.ts, и там же зашито «у звонка есть свой агент — лид дальше
; не раздаётся, остаётся в хронологии клиента с задачей перезвонить».
;
; CRM переводит сюда канал звонящего действием AMI Redirect и заранее кладёт
; в канал переменные:
;   RH_ROUTE_TARGET   — кому звонить: внутренний номер (1003) либо мобильный (девять цифр)
;   RH_ROUTE_MOBILE   — "1", если цель мобильная (набирать наружу), иначе "0"
;   RH_ROUTE_TIMEOUT  — сколько секунд звонить агенту (умолчание CRM — 150)
;   RH_ROUTE_FALLBACK — "voicemail" | "queue" | "hangup" | "ai" — куда при неудаче
;                       (умолчание — queue). Два сценария не путать (11.10.2026):
;                       "voicemail" — свой клиент агента (inboundRouting.ts): робот
;                       НЕ подключается никогда, только голосовая почта;
;                       "ai" — звонок перевёл сам консультант (liveVoiceTransfer.ts),
;                       звонящий ни за кем не закреплён: не взял — назад к консультанту.
[royalhome-agent-route]
exten => agent,1,NoOp(RoyalHome: ответственный ${RH_ROUTE_TARGET}, моб=${RH_ROUTE_MOBILE})
 same => n,Ringing()
 ; ЗАПИСЬ РАЗГОВОРА (21.09.2026, владелец: «запись у всех и всегда»).
 ; Набор отсюда идёт мимо штатных макросов FreePBX (Dial строки аппарата или
 ; Local/<мобильный>@from-internal), и их правила записи AMPUSER/<ext>/recording
 ; сюда не доходят: с 20.09 ~13:21 ни один разговор этого пути не писался.
 ; Блок — тот же, что в ветке «прямо на аппарат» royalhome-inbound: то же имя
 ; in-<звонящий>-<ГГГГММДД-ЧЧММСС>-<uniqueid>.wav, его находит findRecording
 ; (callRecordings.ts) по номеру и времени. b — пишем только соединённый
 ; разговор, без гудков и музыки ожидания.
 ; __REC_STATUS=RECORDING — метка самой FreePBX (sub-record-check): при запасном
 ; пути Queue(1000) правило «always» оператора видит, что канал уже пишется, и
 ; второй файл external-<ext>-… не заводит. По той же метке блок пропускается,
 ; если канал пришёл сюда уже с записью.
 same => n,GotoIf($["${REC_STATUS}" = "RECORDING"]?recdone)
 same => n,Set(__RH_REC=in-${CALLERID(num)}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID})
 same => n,MixMonitor(${STRFTIME(${EPOCH},,%Y/%m/%d)}/${RH_REC}.wav,b)
 same => n,Set(CDR(recordingfile)=${RH_REC}.wav)
 same => n,Set(__REC_STATUS=RECORDING)
 same => n(recdone),NoOp(RoyalHome: запись ${RH_REC})
 same => n,Set(RH_T=${IF($["${RH_ROUTE_TIMEOUT}" = "0"]?:${IF($["${RH_ROUTE_TIMEOUT}" != ""]?${RH_ROUTE_TIMEOUT}:150)})})
 ; ПОДСКАЗКА АГЕНТУ (CRM кладёт имя файла в RH_WHISPER). Пусто — обычное
 ; соединение, как было до 20.08.2026: подсказка необязательна, звонок важнее.
 same => n,Set(RH_OPTS=tTr)
 same => n,ExecIf($["${RH_WHISPER}" != ""]?Set(RH_OPTS=tTrA(royalhome/whisper/${RH_WHISPER})))
 same => n,GotoIf($["${RH_ROUTE_TARGET}" = ""]?fallback)
 same => n,GotoIf($["${RH_ROUTE_MOBILE}" = "1"]?mobile)
 ; Внутренний аппарат агента: строка набора берётся из базы самой станции,
 ; поэтому SIP или PJSIP здесь не зашиты.
 same => n,Dial(${DB(DEVICE/${RH_ROUTE_TARGET}/dial)},${RH_T},${RH_OPTS})
 same => n,Goto(fallback)
 same => n(mobile),Dial(Local/${RH_ROUTE_TARGET}@from-internal/n,${RH_T},${RH_OPTS})
 same => n,Goto(fallback)
 ; ЗАПАСНОЙ ПУТЬ. Сюда приходит всё: агент не взял, занят, аппарат мёртв,
 ; переменные не доехали. Разветвление по RH_ROUTE_FALLBACK — пусто или что
 ; угодно, кроме "voicemail", безопасно трактуется как "queue" (прежнее
 ; поведение): так отказ Setvar на этой переменной не отправит известного
 ; клиента в тишину, а лишь вернёт его в очередь, как было до 29.08.2026.
 same => n(fallback),GotoIf($["${RH_ROUTE_FALLBACK}" = "voicemail"]?voicemail)
 same => n,GotoIf($["${RH_ROUTE_FALLBACK}" = "ai"]?ai)
 same => n,GotoIf($["${RH_ROUTE_FALLBACK}" = "hangup"]?nofallback)
 same => n(queue),NoOp(RoyalHome: агент не ответил — общая очередь операторов)
 same => n,Set(__NODEST=1000)
 same => n,Queue(1000,tr)
 same => n,Hangup()
 ; "hangup" (владелец 04.09.2026): своему клиенту чужой оператор не нужен —
 ; ни очередь, ни автоответчик, просто отбой.
 same => n(nofallback),NoOp(RoyalHome: агент не ответил — отбой без очереди и автоответчика)
 same => n,Hangup()
 ; "ai" (24.09.2026, робозвонок-консультант): звонок перевёл консультант на
 ; телефоне, агент не взял — человек возвращается к консультанту, а не на
 ; автоответчик (Dan 24.09: «автоответчика больше не будет»). Консультант не
 ; принял канал (выключен в Настройках, CRM недоступна) — Stasis вернёт
 ; управление, и дальше голосовая почта как страховка.
 same => n(ai),NoOp(RoyalHome: агент не ответил — назад к консультанту)
 same => n,Set(RH_AIDONE=1)
 same => n,Stasis(royalhome-live-voice,returned)
 same => n,Goto(vmreal)
 ; Свой клиент, агент не ответил, CRM велела автоответчик. С 24.09 в режиме
 ; консультанта трубку брал робот (Stasis missed); владелец 11.10.2026: «робот НЕ
 ; отвечает клиентам агента — агент сам перезвонит». Только голосовая почта, при
 ; любом aimode; задачу и пуш ЭТОМУ агенту ставит CRM (пропущенный звонок).
 same => n(voicemail),NoOp(RoyalHome: свой клиент агента — консультант не подключается)
 ; Формат имени файла и путь — ровно как в royalhome-inbound, чтобы
 ; voicemailIngest.ts подхватил его тем же кодом.
 same => n(vmreal),NoOp(RoyalHome: агент не ответил — голосовая почта)
 same => n,Set(RH_VMNUM=${FILTER(0123456789,${CALLERID(num)})})
 same => n,ExecIf($["${RH_VMNUM}"=""]?Set(RH_VMNUM=unknown))
 same => n,Set(RH_VMFILE=/var/spool/asterisk/royalhome-voicemail/vm-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${RH_VMNUM})
 same => n,Answer()
 same => n,ExecIf($[${STAT(e,/var/lib/asterisk/royalhome/greeting.wav)}]?Playback(/var/lib/asterisk/royalhome/greeting):Playback(beep))
 same => n,ExecIf($[${STAT(e,/var/lib/asterisk/royalhome/greeting.wav)}]?Playback(beep))
 same => n,Record(${RH_VMFILE}.wav,3,120,k)
 same => n,Hangup()

; Страховка от чужого/ошибочного набора: любое расширение этого контекста
; ведёт в тот же безопасный путь, а не в «extension not found» со сбросом.
; h/i/t — служебные расширения Asterisk, шаблон _. их тоже ловит: без этой строки
; отбой заново запускал контекст на уже положенном канале (лог 24.09 10:04:47).
exten => h,1,NoOp(RoyalHome: отбой на переводе агенту)
exten => _.,1,Goto(agent,1)

; === Royal Home CRM: зал ожидания своего агента (владелец 04.09.2026) ===
; Паркуется сюда, когда первая попытка перевода не удалась по причине,
; которая может пройти сама (агент занят/аппарат недоступен) — inboundRouting.ts
; пробует перевод снова каждые несколько секунд, пока клиент слушает музыку.
; Верхняя граница здесь НАМЕРЕННО длиннее Settings.incomingRouteRingSeconds —
; подстраховка на случай перезапуска CRM посреди ожидания, а не рабочий таймер.
[royalhome-agent-wait]
exten => wait,1,NoOp(RoyalHome: ждём освобождения агента)
 same => n,Answer()
 same => n,MusicOnHold(royalhome,210)
 same => n,Hangup()
exten => h,1,NoOp(RoyalHome: отбой в ожидании агента)
exten => _.,1,Goto(wait,1)

; === Royal Home CRM: исходящий звонок агента с подсказкой ===
; CRM поднимает трубку агента и отправляет её сюда, положив в канал:
;   RH_OUT_TARGET — номер клиента, который надо набрать
;   RH_WHISPER    — имя файла подсказки (может быть пустым)
; Без подсказки CRM сюда не заходит вовсе — звонит прежним путём через from-internal.
[royalhome-agent-out]
exten => call,1,NoOp(RoyalHome: исходящий агенту, цель ${RH_OUT_TARGET})
 same => n,Answer()
 same => n,ExecIf($["${RH_WHISPER}" != ""]?Playback(royalhome/whisper/${RH_WHISPER}))
 ; Набор клиента тем же путём, что и обычный исходящий: маршрут и транк выбирает
 ; сама FreePBX, имя транка в CRM не хранится.
 same => n,Dial(Local/${RH_OUT_TARGET}@from-internal/n,60,tT)
 ; --- ПРИМЕНЯЕТСЯ ВРУЧНУЮ (22.09.2026). Необязательное усиление -------------
 ; ЧТО ЭТО. Исход дозвона именно КЛИЕНТУ, объявленный под своим именем, которое
 ; ни с чем не спутать. Обычный DIALSTATUS на одном звонке возникает дважды —
 ; сначала на плече к АГЕНТУ, потом на плече к клиенту, — и годами первый из них
 ; засчитывался ответом клиента (разбор прода 21–22.09.2026: пятнадцать
 ; «разговоров» по 3–13 секунд, у которых плечо к клиенту в CDR стоит NO ANSWER).
 ;
 ; CRM РАБОТАЕТ И БЕЗ ЭТОГО. Настоящая причина была в самой CRM: событие Dial
 ; называет инициатора полем `caller`, а обработчик искал наш канал в `channel`,
 ; которого у этого события в схеме ARI нет вовсе, — плечо к клиенту не узнавалось
 ; своим и его исход не доходил до карточки. Починено в
 ; apps/api/src/lib/telephony/ariEvents.ts. Эти две строки — запас прочности на
 ; случай сборки Asterisk, которая шлёт события иначе, и ничего не меняют в ходе
 ; звонка: они выполняются ПОСЛЕ того, как Dial вернул управление.
 ;
 ; КУДА СТАВИТЬ: в /etc/asterisk/extensions_custom.conf, в блок
 ; [royalhome-agent-out], сразу после строки Dial(Local/${RH_OUT_TARGET}@…) и
 ; перед Hangup(). Применение: `asterisk -rx "dialplan reload"` (без Apply Config
 ; в FreePBX: файл _custom она не перезаписывает). Откат: удалить две строки и
 ; снова dialplan reload.
 same => n,Set(__RH_CLIENT_DIALSTATUS=${DIALSTATUS})
 same => n,Set(__RH_CLIENT_ANSWERED=${IF($["${DIALSTATUS}" = "ANSWER"]?1:0)})
 ; --------------------------------------------------------------------------
 same => n,Hangup()

; Ошибочный набор ведёт туда же, а не в «extension not found» со сбросом.
exten => _.,1,Goto(call,1)

; --- Стенд проверки живого голоса (Claude, 12.09.2026) ---------------------
; Молчащий «абонент»: снимает трубку и ждёт. Нужен, чтобы проверять звук ИИ без
; звонка на настоящий телефон. Ни один маршрут сюда не ведёт — контекст
; вызывается только вручную через ARI originate. Можно удалить в любой момент.
[royalhome-live-voice-selftest]
exten => s,1,Answer()
 same => n,MixMonitor(/tmp/lvtest.wav,r)
 same => n,Wait(120)
 same => n,Hangup()

; === Royal Home CRM: перевод с офисного телефона агенту объекта (24.09.2026) ===
; Решение Dan: оператор говорит с клиентом по кнопочному IP-телефону и, поняв,
; о каком объекте речь, нажимает «Перевод» и набирает 7 и номер объекта из
; четырёх-пяти цифр: объект 132 — 7132, объект 45 — 7045 (ноль добивает до
; четырёх). Кнопки в CRM для этого нет.
;
; Станция отдаёт канал звонящего в Stasis-приложение CRM (то же royal-home-crm,
; что слушает события): CRM находит агента объекта и звонит ему через
; royalhome-agent-route — с подсказкой по приметам объекта, записью и возвратом
; в очередь операторов, если агент не взял (apps/api/src/lib/telephony/deskTransfer.ts).
; CRM не на связи или объект не найден — строка после Stasis: очередь операторов,
; клиент не теряется.
;
; ПОЧЕМУ НЕ _7X. — короче четырёх цифр и длиннее пяти на 7 не набирается ничего:
; трёхзначные 7xx могут оказаться группами обзвона FreePBX, а длинные номера на 7
; — городскими и мобильными (77x…, 70x…), которые должны уходить наружу как раньше.
;
; from-internal-custom FreePBX включает первым в from-internal (и в
; from-internal-xfer, куда приходит перевод): коды ниже сильнее маршрутов наружу.
; Проверить, что перевод попадает сюда:
;   asterisk -rx "dialplan show 7132@from-internal"
;   asterisk -rx "dialplan show 7132@from-internal-xfer"
; В обоих ответах должен быть контекст royalhome-desk-transfer.
; Откат: удалить оба блока + dialplan reload.
[from-internal-custom]
exten => _7XXX,1,Set(RH_DESK_OBJ=${EXTEN:1})
 same => n,Goto(royalhome-desk-transfer,s,1)
exten => _7XXXX,1,Set(RH_DESK_OBJ=${EXTEN:1})
 same => n,Goto(royalhome-desk-transfer,s,1)

[royalhome-desk-transfer]
exten => s,1,NoOp(RoyalHome: перевод агенту объекта ${RH_DESK_OBJ})
 same => n,Stasis(royal-home-crm,desk-transfer,${RH_DESK_OBJ})
 ; Сюда — только если CRM не взяла канал или вернула его (объект не найден,
 ; агент занят): очередь операторов, как при обычном входящем.
 same => n,NoOp(RoyalHome: перевод не состоялся (${STASISSTATUS}) — очередь операторов)
 same => n,Set(__NODEST=1000)
 same => n,Queue(1000,tr)
 same => n,Hangup()
exten => h,1,NoOp(RoyalHome: отбой на переводе по объекту)
