name: Source checks

on:
  push:
    branches: [main, "source-checks/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  precheck:
    name: precheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/royal_home_crm
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Reject private or mixed Git ancestry
        run: test "$(git rev-list --max-parents=0 HEAD)" = '0c6887d5993e0bae3fae125d27d6ad2525ec47bb'
      - name: Scan public Git history for secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir "$RUNNER_TEMP/gitleaks"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | (cd "$RUNNER_TEMP/gitleaks" && sha256sum --check)
          tar -xzf "$RUNNER_TEMP/gitleaks/gitleaks_8.30.1_linux_x64.tar.gz" -C "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts=--all --redact --no-banner
      - run: npm ci --no-audit --no-fund
      - run: npm run prisma:generate
      - name: Build, frontend tests and source guards
        run: npm run precheck -- --no-tests
      - name: Release and infrastructure regression tests
        run: npm run test:scripts
      - name: Select API runtime image inputs
        id: api_image
        env:
          API_IMAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/api-image-check.mjs plan >> "$GITHUB_OUTPUT"
      - name: Build API image and verify Prisma without network
        if: steps.api_image.outputs.required == 'true'
        env:
          API_IMAGE_REPORT: ${{ runner.temp }}/api-image-offline-check.json
          API_IMAGE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/api-image-check.mjs check
      - name: Retain exact API image verification
        if: always() && steps.api_image.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: api-image-offline-check
          path: ${{ runner.temp }}/api-image-offline-check.json
          if-no-files-found: error
          retention-days: 14
